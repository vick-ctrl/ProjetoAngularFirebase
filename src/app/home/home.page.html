<ion-content [fullscreen]="true">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <table border="1">
        <tr>
            <th>ISBN</th>
            <th>Titulo</th>
            <th>Categoria</th>
            <th>Ações</th>
        </tr>
       
        <ng-container *ngFor="let livro of this.livros">

            <tr>
                <td>{{ livro.isbn }}</td>
                <td>{{ livro.titulo }}</td>
                <td>
                <ion-card>
                        <ng-container *ngFor="let cat of livro.categoria">
                         <ion-label>{{cat.nome}}</ion-label>
                         <br>
                        </ng-container>
                </ion-card>
                    
                </td>
                <td>
                    <ion-button>
                        <ion-icon name="trash-outline"></ion-icon>
                    </ion-button>
                    <ion-button>
                        <ion-icon name="create-outline"></ion-icon>
                    </ion-button>
                </td>
            </tr>

        </ng-container>

    </table>
    
    
</ion-content>
